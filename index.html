<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>♛ CHESS ♛</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/styles.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
</head>

<body>

    <h1 class="title">♛ CHESS ♛</h1>

    <div class="controls">
        <button id="startBtn" class="control-btn">Start</button>
        <button id="resetBtn" class="control-btn">Reset</button>

        <button id="easy" class="control-btn diff-btn active">Easy</button>
        <button id="medium" class="control-btn diff-btn">Medium</button>
        <button id="hard" class="control-btn diff-btn">Hard</button>

        <button id="themeBtn" class="control-btn">Dark / Light</button>
        
        </div>

    <div class="board-wrapper">
        <div id="chessBoard" class="chess-board"></div>
    </div>

    <script src="scripts/game.js"></script>

</body>
</html>
