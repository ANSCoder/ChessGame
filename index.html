<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess Game</title>

<style>
:root {
  --light-square: #eee;
  --dark-square: #666;
  --border-color: #333;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  text-align: center;
}

h1 {
  margin-top: 20px;
}

.chess-board {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  grid-template-rows: repeat(8, 1fr);
  width: 100%;
  max-width: 600px;
  aspect-ratio: 1;
  margin: 20px auto;
  border: 4px solid var(--border-color);
}

.square {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2rem;
  cursor: pointer;
}

.white-square {
  background-color: var(--light-square);
}

.black-square {
  background-color: var(--dark-square);
}

.selected {
  outline: 3px solid red;
}
</style>
</head>

<body>

<h1>Chess Game</h1>
<div id="chessBoard" class="chess-board"></div>

<script>
const boardElement = document.getElementById('chessBoard');

const pieces = {
    'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚', 'p': '♟',
    'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔', 'P': '♙'
};

let boardState = [
    ['r','n','b','q','k','b','n','r'],
    ['p','p','p','p','p','p','p','p'],
    [null,null,null,null,null,null,null,null],
    [null,null,null,null,null,null,null,null],
    [null,null,null,null,null,null,null,null],
    [null,null,null,null,null,null,null,null],
    ['P','P','P','P','P','P','P','P'],
    ['R','N','B','Q','K','B','N','R']
];

let selected = null;
let currentTurn = 'white';

function renderBoard() {
    boardElement.innerHTML = '';

    for (let row = 0; row < 8; row++) {
        for (let col = 0; col < 8; col++) {
            const square = document.createElement('div');
            square.classList.add('square');
            square.classList.add((row + col) % 2 === 0 ? 'white-square' : 'black-square');
            square.dataset.row = row;
            square.dataset.col = col;

            if (selected && selected.row === row && selected.col === col) {
                square.classList.add('selected');
            }

            const piece = boardState[row][col];
            if (piece) {
                square.textContent = pieces[piece];
            }

            square.addEventListener('click', handleClick);
            boardElement.appendChild(square);
        }
    }
}

function handleClick(e) {
    const row = parseInt(e.currentTarget.dataset.row);
    const col = parseInt(e.currentTarget.dataset.col);
    const piece = boardState[row][col];

    if (selected) {
        if (isValidMove(selected.row, selected.col, row, col)) {
            movePiece(selected.row, selected.col, row, col);
            currentTurn = currentTurn === 'white' ? 'black' : 'white';
        }
        selected = null;
        renderBoard();
        return;
    }

    if (!piece) return;

    if (currentTurn === 'white' && piece === piece.toUpperCase()) {
        selected = { row, col };
    }

    if (currentTurn === 'black' && piece === piece.toLowerCase()) {
        selected = { row, col };
    }

    renderBoard();
}

function movePiece(fr, fc, tr, tc) {
    boardState[tr][tc] = boardState[fr][fc];
    boardState[fr][fc] = null;
}

function isValidMove(fr, fc, tr, tc) {
    if (tr < 0 || tr > 7 || tc < 0 || tc > 7) return false;

    const piece = boardState[fr][fc];
    const target = boardState[tr][tc];

    if (target && isSameColor(piece, target)) return false;

    switch (piece.toLowerCase()) {
        case 'p':
            return validatePawnMove(piece, fr, fc, tr, tc);
        case 'r':
            return validateRookMove(fr, fc, tr, tc);
        default:
            return false;
    }
}

function isSameColor(p1, p2) {
    return (p1 === p1.toUpperCase() && p2 === p2.toUpperCase()) ||
           (p1 === p1.toLowerCase() && p2 === p2.toLowerCase());
}

function validatePawnMove(piece, fr, fc, tr, tc) {
    const direction = piece === piece.toUpperCase() ? -1 : 1;
    const startRow = piece === piece.toUpperCase() ? 6 : 1;

    // forward move
    if (fc === tc) {
        if (tr === fr + direction && !boardState[tr][tc]) return true;

        if (fr === startRow &&
            tr === fr + 2 * direction &&
            !boardState[fr + direction][tc] &&
            !boardState[tr][tc]) return true;
    }

    // capture
    if (Math.abs(fc - tc) === 1 &&
        tr === fr + direction &&
        boardState[tr][tc]) return true;

    return false;
}

function validateRookMove(fr, fc, tr, tc) {
    if (fr !== tr && fc !== tc) return false;

    const stepRow = tr === fr ? 0 : (tr > fr ? 1 : -1);
    const stepCol = tc === fc ? 0 : (tc > fc ? 1 : -1);

    let r = fr + stepRow;
    let c = fc + stepCol;

    while (r !== tr || c !== tc) {
        if (boardState[r][c]) return false;
        r += stepRow;
        c += stepCol;
    }

    return true;
}

renderBoard();
</script>

</body>
</html>
