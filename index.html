<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Game</title>
    <style>
        :root {
            --primary-color: #4CAF50;
            --secondary-color: #fff;
            --font-family: 'Arial', sans-serif;
            --font-size: 16px;
            --spacing: 10px;
        }
        body {
            margin: 0;
            font-family: var(--font-family);
            background-color: var(--secondary-color);
            padding: var(--spacing);
        }
        header {
            background: var(--primary-color);
            color: var(--secondary-color);
            padding: var(--spacing);
            text-align: center;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: var(--spacing);
        }
        @media (max-width: 600px) {
            body {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to the Chess Game</h1>
    </header>
    <div class="container">
        <p>This is an improved index file for the Chess Game project.</p>
    </div>
</body>
</html>
