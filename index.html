<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>♛ CHESS ♛</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.13.4/chess.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body>

<h1 class="title">♛ CHESS ♛</h1>

<div class="controls">
    <button id="startBtn">Start</button>
    <button id="resetBtn">Reset</button>
    <button id="themeBtn">Toggle Dark/Light</button>
    <button id="modeBtn">2D / 3D</button>
</div>

<div id="chessBoard" class="chess-board"></div>

<script>

document.addEventListener("DOMContentLoaded", function(){

let game = new Chess();
let selectedSquare = null;
let mode = "2D";

const boardElement = document.getElementById("chessBoard");

const pieceMap = {
  p:'♟', r:'♜', n:'♞', b:'♝', q:'♛', k:'♚',
  P:'♙', R:'♖', N:'♘', B:'♗', Q:'♕', K:'♔'
};

function startGame(){
    game.reset();
    render();
}

function resetGame(){
    startGame();
}

function toggleTheme(){
    document.body.classList.toggle("light-mode");
}

function toggleMode(){
    mode = mode === "2D" ? "3D" : "2D";
    render();
}

function render(){
    if(mode === "2D") render2D();
    else render3D();
}

function render2D(){
    boardElement.innerHTML = "";
    const board = game.board();

    for(let r=0;r<8;r++){
        for(let c=0;c<8;c++){
            const square = document.createElement("div");
            square.classList.add("square");
            square.classList.add((r+c)%2===0?"white-square":"black-square");
            square.dataset.square = String.fromCharCode(97+c)+(8-r);

            const piece = board[r][c];
            if(piece){
                const key = piece.color==="w"
                    ? piece.type.toUpperCase()
                    : piece.type;
                square.textContent = pieceMap[key];
            }

            square.onclick = handleClick;
            boardElement.appendChild(square);
        }
    }
}

function handleClick(e){
    if(game.turn() !== "w") return;

    const square = e.target.dataset.square;

    if(selectedSquare){
        const move = game.move({
            from:selectedSquare,
            to:square,
            promotion:"q"
        });

        selectedSquare = null;

        if(move){
            render();
            setTimeout(aiMove,300);
        } else {
            render();
        }
        return;
    }

    selectedSquare = square;
}

function aiMove(){
    const moves = game.moves({verbose:true});
    if(!moves.length) return;
    const randomMove = moves[Math.floor(Math.random()*moves.length)];
    game.move(randomMove);
    render();
}

function render3D(){
    boardElement.innerHTML = "<p>3D Mode Enabled (Board hidden for now)</p>";
}

document.getElementById("startBtn").onclick = startGame;
document.getElementById("resetBtn").onclick = resetGame;
document.getElementById("themeBtn").onclick = toggleTheme;
document.getElementById("modeBtn").onclick = toggleMode;

startGame();

});
</script>

</body>
</html>
