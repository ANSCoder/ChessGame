<script>
const boardElement = document.getElementById('chessBoard');

const pieces = {
    'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚', 'p': '♟',
    'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔', 'P': '♙'
};

let boardState = [
    ['r','n','b','q','k','b','n','r'],
    ['p','p','p','p','p','p','p','p'],
    [null,null,null,null,null,null,null,null],
    [null,null,null,null,null,null,null,null],
    [null,null,null,null,null,null,null,null],
    [null,null,null,null,null,null,null,null],
    ['P','P','P','P','P','P','P','P'],
    ['R','N','B','Q','K','B','N','R']
];

let selected = null;
let currentTurn = 'white';

function renderBoard() {
    boardElement.innerHTML = '';

    for (let row = 0; row < 8; row++) {
        for (let col = 0; col < 8; col++) {
            const square = document.createElement('div');
            square.className = (row + col) % 2 === 0 ? 'whiteSquare' : 'blackSquare';
            square.dataset.row = row;
            square.dataset.col = col;

            const piece = boardState[row][col];
            if (piece) {
                const pieceDiv = document.createElement('div');
                pieceDiv.className = 'piece';
                pieceDiv.innerHTML = pieces[piece];
                square.appendChild(pieceDiv);
            }

            square.addEventListener('click', handleClick);
            boardElement.appendChild(square);
        }
    }
}

function handleClick(e) {
    const row = parseInt(e.currentTarget.dataset.row);
    const col = parseInt(e.currentTarget.dataset.col);
    const piece = boardState[row][col];

    if (selected) {
        if (isValidMove(selected.row, selected.col, row, col)) {
            movePiece(selected.row, selected.col, row, col);
            currentTurn = currentTurn === 'white' ? 'black' : 'white';
        }
        selected = null;
        renderBoard();
        return;
    }

    if (!piece) return;

    if (currentTurn === 'white' && piece === piece.toUpperCase()) {
        selected = { row, col };
    }

    if (currentTurn === 'black' && piece === piece.toLowerCase()) {
        selected = { row, col };
    }
}

function movePiece(fromRow, fromCol, toRow, toCol) {
    boardState[toRow][toCol] = boardState[fromRow][fromCol];
    boardState[fromRow][fromCol] = null;
}

function isValidMove(fromRow, fromCol, toRow, toCol) {
    const piece = boardState[fromRow][fromCol];
    const target = boardState[toRow][toCol];

    if (target && isSameColor(piece, target)) return false;

    switch (piece.toLowerCase()) {
        case 'p':
            return validatePawnMove(piece, fromRow, fromCol, toRow, toCol);
        case 'r':
            return validateRookMove(fromRow, fromCol, toRow, toCol);
        default:
            return false; // add others later
    }
}

function isSameColor(p1, p2) {
    return (p1 === p1.toUpperCase() && p2 === p2.toUpperCase()) ||
           (p1 === p1.toLowerCase() && p2 === p2.toLowerCase());
}

/* ---------- Pawn Logic ---------- */
function validatePawnMove(piece, fr, fc, tr, tc) {
    const direction = piece === piece.toUpperCase() ? -1 : 1;
    const startRow = piece === piece.toUpperCase() ? 6 : 1;

    if (fc === tc && !boardState[tr][tc]) {
        if (tr === fr + direction) return true;
        if (fr === startRow && tr === fr + 2 * direction) return true;
    }

    if (Math.abs(fc - tc) === 1 && tr === fr + direction && boardState[tr][tc]) {
        return true;
    }

    return false;
}

/* ---------- Rook Logic ---------- */
function validateRookMove(fr, fc, tr, tc) {
    if (fr !== tr && fc !== tc) return false;

    const stepRow = tr === fr ? 0 : (tr > fr ? 1 : -1);
    const stepCol = tc === fc ? 0 : (tc > fc ? 1 : -1);

    let r = fr + stepRow;
    let c = fc + stepCol;

    while (r !== tr || c !== tc) {
        if (boardState[r][c]) return false;
        r += stepRow;
        c += stepCol;
    }

    return true;
}

renderBoard();
</script>
